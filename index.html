<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="The System">
  <title>THE SYSTEM - Workout Tracker</title>
  <style>
    :root {
      --bg: #090d16;
      --card-bg: #0f172a;
      --card-border: rgba(56, 189, 248, 0.2);
      --card-border-glow: rgba(56, 189, 248, 0.5);
      --cyan: #38bdf8;
      --cyan-bright: #0ea5e9;
      --gold: #f59e0b;
      --red: #ef4444;
      --green: #10b981;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --sat: env(safe-area-inset-top, 20px);
      --sab: env(safe-area-inset-bottom, 20px);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      overflow-x: hidden;
      padding-top: calc(var(--sat) + 125px);
      padding-bottom: calc(var(--sab) + 75px);
    }

    /* Fixed Top HUD */
    .top-hud {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      background: rgba(9, 13, 22, 0.95);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--card-border);
      z-index: 100;
      padding: calc(var(--sat) + 8px) 16px 8px;
    }

    .player-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 6px;
    }

    .player-name-wrap {
      display: flex;
      align-items: center;
      gap: 6px;
      cursor: pointer;
    }

    .player-name {
      font-size: 1.05rem;
      font-weight: 800;
      letter-spacing: 0.05em;
      color: #fff;
    }

    .player-rank {
      font-size: 0.75rem;
      font-weight: 700;
      color: var(--cyan);
      background: rgba(56, 189, 248, 0.1);
      border: 1px solid rgba(56, 189, 248, 0.3);
      padding: 2px 6px;
      border-radius: 4px;
    }

    .player-level {
      font-size: 0.9rem;
      font-weight: 800;
      color: var(--gold);
    }

    .exp-bar-bg {
      width: 100%;
      height: 4px;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 2px;
      overflow: hidden;
      margin-bottom: 8px;
    }

    .exp-bar-fill {
      height: 100%;
      background: linear-gradient(90deg, var(--cyan), var(--gold));
      width: 0%;
      transition: width 0.4s ease;
    }

    /* Integrated Rest Timer HUD */
    .rest-hud {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: rgba(15, 23, 42, 0.8);
      border: 1px solid var(--card-border);
      border-radius: 6px;
      padding: 4px 8px;
      font-size: 0.8rem;
    }

    .rest-hud-title {
      font-weight: 800;
      color: var(--cyan);
      letter-spacing: 0.05em;
    }

    .rest-quick-btns {
      display: flex;
      gap: 4px;
    }

    .rest-quick-btn {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
      color: var(--text-muted);
      font-size: 0.75rem;
      padding: 2px 6px;
      border-radius: 4px;
      cursor: pointer;
    }

    .rest-active-box {
      display: none;
      align-items: center;
      justify-content: space-between;
      width: 100%;
    }

    .rest-active-time {
      font-size: 0.95rem;
      font-weight: 800;
      color: var(--gold);
      min-width: 50px;
    }

    .rest-active-actions {
      display: flex;
      gap: 4px;
    }

    .rest-action-btn {
      background: rgba(56, 189, 248, 0.1);
      border: 1px solid rgba(56, 189, 248, 0.3);
      color: var(--cyan);
      font-size: 0.75rem;
      font-weight: 700;
      padding: 3px 6px;
      border-radius: 4px;
      cursor: pointer;
    }

    /* Main Container */
    .container {
      padding: 12px 16px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    /* Section Cards */
    .system-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 10px;
      padding: 14px;
      position: relative;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
    }

    .system-card::before {
      content: "";
      position: absolute;
      top: -1px;
      left: 10px;
      right: 10px;
      height: 1px;
      background: linear-gradient(90deg, transparent, var(--card-border-glow), transparent);
    }

    .card-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }

    .card-title {
      font-size: 0.95rem;
      font-weight: 800;
      color: var(--cyan);
      letter-spacing: 0.05em;
    }

    /* Warm-up Section */
    .warmup-box {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: rgba(0, 0, 0, 0.3);
      border: 1px solid rgba(255, 255, 255, 0.05);
      border-radius: 6px;
      padding: 10px 12px;
    }

    .timer-display {
      font-size: 1.4rem;
      font-weight: 900;
      color: var(--cyan);
      font-variant-numeric: tabular-nums;
    }

    .warmup-actions {
      display: flex;
      gap: 6px;
    }

    .btn-timer {
      background: rgba(56, 189, 248, 0.15);
      border: 1px solid var(--cyan);
      color: #fff;
      font-size: 0.8rem;
      font-weight: 700;
      padding: 6px 12px;
      border-radius: 6px;
      cursor: pointer;
    }

    .btn-timer.active {
      background: rgba(239, 68, 68, 0.2);
      border-color: var(--red);
      color: var(--red);
    }

    /* Exercise Items */
    .exercise-item {
      display: flex;
      flex-direction: column;
      gap: 8px;
      padding: 12px 0;
      border-bottom: 1px solid rgba(255, 255, 255, 0.06);
    }

    .exercise-item:last-child {
      border-bottom: none;
      padding-bottom: 0;
    }

    .ex-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .ex-name {
      font-size: 0.95rem;
      font-weight: 700;
      color: #fff;
    }

    .ex-pr {
      font-size: 0.75rem;
      color: var(--text-muted);
    }

    .ex-pr span {
      color: var(--gold);
      font-weight: 700;
    }

    /* Set Rows & Stepper Capsules */
    .set-row {
      display: grid;
      grid-template-columns: 24px 1fr 1fr 34px;
      gap: 8px;
      align-items: center;
      margin-top: 4px;
    }

    .set-num-box {
      display: flex;
      align-items: center;
      justify-content: space-between;
      cursor: pointer;
    }

    .set-num {
      font-size: 0.75rem;
      font-weight: 800;
      color: var(--text-muted);
    }

    .btn-trash {
      color: rgba(239, 68, 68, 0.6);
      font-size: 0.75rem;
      padding: 2px;
    }

    .stepper-capsule {
      display: grid;
      grid-template-columns: 28px 1fr 28px;
      background: rgba(0, 0, 0, 0.4);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 6px;
      overflow: hidden;
      align-items: center;
    }

    .stepper-btn {
      background: transparent;
      border: none;
      color: var(--cyan);
      font-size: 1rem;
      font-weight: 800;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 32px;
    }

    .stepper-btn:active {
      background: rgba(56, 189, 248, 0.2);
    }

    .stepper-input {
      background: transparent;
      border: none;
      color: #fff;
      font-size: 0.85rem;
      font-weight: 700;
      text-align: center;
      width: 100%;
      outline: none;
      -webkit-appearance: none;
    }

    .stepper-input.bw-mode {
      color: var(--cyan);
      font-weight: 800;
    }

    .btn-check {
      width: 32px;
      height: 32px;
      border-radius: 6px;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.15);
      color: var(--text-muted);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-size: 0.9rem;
      transition: all 0.2s;
    }

    .btn-check.completed {
      background: var(--green);
      border-color: var(--green);
      color: #fff;
    }

    .add-set-link {
      font-size: 0.75rem;
      color: var(--cyan);
      font-weight: 700;
      margin-top: 6px;
      display: inline-block;
      cursor: pointer;
    }

    /* Primary Bottom Action */
    .finish-workout-btn {
      background: rgba(15, 23, 42, 0.9);
      border: 1px solid var(--card-border-glow);
      color: #fff;
      font-size: 0.95rem;
      font-weight: 900;
      letter-spacing: 0.08em;
      padding: 14px;
      border-radius: 8px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: relative;
      margin-top: 10px;
      box-shadow: 0 0 15px rgba(56, 189, 248, 0.2);
    }

    .finish-workout-btn:active {
      transform: scale(0.99);
      background: rgba(56, 189, 248, 0.15);
    }

    .exp-badge {
      background: rgba(245, 158, 11, 0.2);
      border: 1px solid var(--gold);
      color: var(--gold);
      font-size: 0.75rem;
      padding: 2px 6px;
      border-radius: 4px;
    }

    /* Add Exercise Modal */
    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(0, 0, 0, 0.8);
      backdrop-filter: blur(8px);
      z-index: 200;
      display: none;
      align-items: flex-end;
    }

    .modal-sheet {
      width: 100%;
      max-height: 85vh;
      background: var(--card-bg);
      border-top: 1px solid var(--cyan);
      border-radius: 16px 16px 0 0;
      display: flex;
      flex-direction: column;
      padding: 16px;
      padding-bottom: calc(var(--sab) + 16px);
    }

    .modal-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }

    .modal-title {
      font-size: 1.05rem;
      font-weight: 800;
      color: var(--cyan);
    }

    .modal-close {
      color: var(--text-muted);
      font-size: 1.2rem;
      cursor: pointer;
    }

    .modal-tabs {
      display: flex;
      gap: 8px;
      margin-bottom: 12px;
    }

    .modal-tab {
      flex: 1;
      text-align: center;
      padding: 8px;
      font-size: 0.8rem;
      font-weight: 700;
      border-radius: 6px;
      background: rgba(255, 255, 255, 0.05);
      color: var(--text-muted);
      cursor: pointer;
    }

    .modal-tab.active {
      background: var(--cyan);
      color: #000;
    }

    .search-input {
      width: 100%;
      background: rgba(0, 0, 0, 0.4);
      border: 1px solid rgba(255, 255, 255, 0.1);
      color: #fff;
      padding: 8px 12px;
      border-radius: 6px;
      margin-bottom: 12px;
      font-size: 0.85rem;
      outline: none;
    }

    .exercise-list {
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .lib-item {
      background: rgba(0, 0, 0, 0.2);
      border: 1px solid rgba(255, 255, 255, 0.05);
      border-radius: 6px;
      padding: 10px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      cursor: pointer;
    }

    .lib-item-name {
      font-size: 0.85rem;
      font-weight: 700;
    }

    .lib-item-cat {
      font-size: 0.7rem;
      color: var(--cyan);
    }

    /* Bottom Navigation */
    .bottom-nav {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background: rgba(9, 13, 22, 0.95);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-top: 1px solid var(--card-border);
      display: flex;
      padding-bottom: var(--sab);
      z-index: 100;
    }

    .nav-btn {
      flex: 1;
      text-align: center;
      padding: 10px;
      font-size: 0.75rem;
      font-weight: 800;
      color: var(--text-muted);
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
    }

    .nav-btn.active {
      color: var(--cyan);
    }

    .tab-content {
      display: none;
    }

    .tab-content.active {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    /* History & Status Layouts */
    .history-card {
      background: rgba(0, 0, 0, 0.3);
      border: 1px solid rgba(255, 255, 255, 0.06);
      border-radius: 8px;
      padding: 10px 12px;
      margin-bottom: 8px;
    }

    .history-date {
      font-size: 0.75rem;
      color: var(--cyan);
      margin-bottom: 4px;
    }
  </style>
</head>
<body>

  <!-- FIXED TOP HUD -->
  <header class="top-hud">
    <div class="player-row">
      <div class="player-name-wrap" onclick="editPlayerName()">
        <span class="player-name" id="playerNameDisplay">HUNTER</span>
        <span style="font-size: 0.75rem; color: var(--text-muted);">✎</span>
        <span class="player-rank" id="playerRankDisplay">E-RANG</span>
      </div>
      <div class="player-level" id="playerLevelDisplay">LVL 1</div>
    </div>
    
    <div class="exp-bar-bg">
      <div class="exp-bar-fill" id="expBarFill"></div>
    </div>

    <!-- SATZPAUSE TIMER BAR -->
    <div class="rest-hud">
      <div class="rest-idle-box" id="restIdleBox" style="display: flex; justify-content: space-between; width: 100%; align-items: center;">
        <span class="rest-hud-title">SATZPAUSE</span>
        <div class="rest-quick-btns">
          <button class="rest-quick-btn" onclick="startRestTimer(60)">60s</button>
          <button class="rest-quick-btn" onclick="startRestTimer(90)">90s</button>
          <button class="rest-quick-btn" onclick="startRestTimer(120)">120s</button>
        </div>
      </div>
      <div class="rest-active-box" id="restActiveBox">
        <span class="rest-hud-title">SATZPAUSE</span>
        <span class="rest-active-time" id="restActiveCountdown">01:30</span>
        <div class="rest-active-actions">
          <button class="rest-action-btn" onclick="adjustRestTimer(-15)">-15s</button>
          <button class="rest-action-btn" onclick="adjustRestTimer(15)">+15s</button>
          <button class="rest-action-btn" onclick="skipRestTimer()">SKIP</button>
        </div>
      </div>
    </div>
  </header>

  <!-- APP VIEW CONTAINER -->
  <main class="container">
    
    <!-- TAB: TRAINING -->
    <section class="tab-content active" id="tabTraining">
      
      <!-- CROSSTRAINER WARMUP -->
      <div class="system-card">
        <div class="card-head">
          <span class="card-title">CROSSTRAINER AUFWÄRMEN</span>
          <span style="font-size: 0.75rem; color: var(--cyan);">+50 EXP</span>
        </div>
        <div class="warmup-box">
          <div>
            <div class="timer-display" id="warmupDisplay">10:00</div>
            <div style="font-size: 0.75rem; color: var(--text-muted);">Empfohlen: Stufe 6–8</div>
          </div>
          <div class="warmup-actions">
            <button class="btn-timer" id="warmupToggleBtn" onclick="toggleWarmupTimer()">START</button>
            <button class="btn-timer" onclick="resetWarmupTimer()">RESET</button>
          </div>
        </div>
      </div>

      <!-- WORKOUT PLAN -->
      <div class="system-card">
        <div class="card-head">
          <span class="card-title">GANZKÖRPER TRAINING</span>
          <button style="background: transparent; border: none; color: var(--cyan); font-size: 0.8rem; font-weight: 700; cursor: pointer;" onclick="openAddExerciseModal()">+ ÜBUNG</button>
        </div>

        <div id="exerciseContainer">
          <!-- Dynamic Exercise Items Rendered Here -->
        </div>

        <button class="finish-workout-btn" onclick="finishQuest()">
          <span>QUEST ABSCHLIESSEN</span>
          <span class="exp-badge">+150 EXP</span>
        </button>
      </div>

    </section>

    <!-- TAB: STATUS / REKORDE -->
    <section class="tab-content" id="tabStatus">
      <div class="system-card">
        <div class="card-head">
          <span class="card-title">PERSÖNLICHE REKORDE (PRS)</span>
        </div>
        <div id="prListContainer">
          <!-- PRs listed here -->
        </div>
      </div>
      
      <div class="system-card">
        <div class="card-head">
          <span class="card-title">SPIELER-ATTRIBUTE</span>
        </div>
        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 8px; font-size: 0.85rem;">
          <div style="background: rgba(0,0,0,0.3); padding: 8px; border-radius: 6px;">STR: <b id="statStr" style="color:var(--cyan)">10</b></div>
          <div style="background: rgba(0,0,0,0.3); padding: 8px; border-radius: 6px;">VIT: <b id="statVit" style="color:var(--cyan)">10</b></div>
          <div style="background: rgba(0,0,0,0.3); padding: 8px; border-radius: 6px;">AGI: <b id="statAgi" style="color:var(--cyan)">10</b></div>
          <div style="background: rgba(0,0,0,0.3); padding: 8px; border-radius: 6px;">INT: <b id="statInt" style="color:var(--cyan)">10</b></div>
        </div>
      </div>
    </section>

    <!-- TAB: CHRONIK -->
    <section class="tab-content" id="tabHistory">
      <div class="system-card">
        <div class="card-head">
          <span class="card-title">TRAININGS-CHRONIK</span>
        </div>
        <div id="historyContainer">
          <!-- Past Workouts -->
        </div>
      </div>
    </section>

  </main>

  <!-- ADD EXERCISE MODAL -->
  <div class="modal-overlay" id="addExerciseModal">
    <div class="modal-sheet">
      <div class="modal-head">
        <span class="modal-title">ÜBUNG HINZUFÜGEN</span>
        <span class="modal-close" onclick="closeAddExerciseModal()">✕</span>
      </div>

      <div class="modal-tabs">
        <div class="modal-tab active" id="tabLibBtn" onclick="switchModalTab('lib')">DATENBANK</div>
        <div class="modal-tab" id="tabCustomBtn" onclick="switchModalTab('custom')">EIGENE ÜBUNG</div>
      </div>

      <!-- Library Tab -->
      <div id="modalTabLib">
        <input type="text" class="search-input" id="searchExInput" placeholder="Übung suchen..." oninput="filterExerciseLibrary()">
        <div class="exercise-list" id="exerciseLibraryList" style="max-height: 50vh;"></div>
      </div>

      <!-- Custom Exercise Tab -->
      <div id="modalTabCustom" style="display: none; flex-direction: column; gap: 10px;">
        <input type="text" class="search-input" id="customExName" placeholder="Name der Übung">
        <input type="text" class="search-input" id="customExCategory" placeholder="Kategorie (z. B. Trizeps, Brust)">
        <button class="btn-timer" style="padding: 10px; width: 100%;" onclick="saveCustomExercise()">HINZUFÜGEN</button>
      </div>
    </div>
  </div>

  <!-- BOTTOM NAVIGATION -->
  <nav class="bottom-nav">
    <div class="nav-btn active" onclick="switchTab('tabTraining', this)">
      <span>⚔️</span>
      <span>TRAINING</span>
    </div>
    <div class="nav-btn" onclick="switchTab('tabStatus', this)">
      <span>📊</span>
      <span>STATUS</span>
    </div>
    <div class="nav-btn" onclick="switchTab('tabHistory', this)">
      <span>📜</span>
      <span>CHRONIK</span>
    </div>
  </nav>

  <script>
    /* ==========================================================================
       ORIGINAL SOUND ASSETS (WOW BASE64)

    let audioCtx = null;
    let questDoneBuffer = null;

    // Decode Ogg sound using Web Audio API on iOS Safari
    async function initAudioEngine() {
      if (audioCtx) return;
      try {
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        audioCtx = new AudioContext();

        // Convert base64 OGG to ArrayBuffer
        const binaryString = atob(SND_QUEST_DONE_B64);
        const len = binaryString.length;
        const bytes = new Uint8Array(len);
        for (let i = 0; i < len; i++) {
          bytes[i] = binaryString.charCodeAt(i);
        }

        audioCtx.decodeAudioData(bytes.buffer, (buffer) => {
          questDoneBuffer = buffer;
        }, (err) => {
          console.warn("Ogg Decode Error:", err);
        });
      } catch (e) {
        console.warn("Audio Context init error:", e);
      }
    }

    // Unlock iOS Audio on first touch/click
    document.addEventListener('touchstart', function unlock() {
      initAudioEngine();
      if (audioCtx && audioCtx.state === 'suspended') {
        audioCtx.resume();
      }
      document.removeEventListener('touchstart', unlock);
    }, { once: true });

    document.addEventListener('click', function unlockClick() {
      initAudioEngine();
      if (audioCtx && audioCtx.state === 'suspended') {
        audioCtx.resume();
      }
      document.removeEventListener('click', unlockClick);
    }, { once: true });

    function playQuestDoneSound() {
      if (audioCtx && questDoneBuffer) {
        try {
          const source = audioCtx.createBufferSource();
          source.buffer = questDoneBuffer;
          source.connect(audioCtx.destination);
          source.start(0);
          return;
        } catch (e) {
          console.warn("WebAudio playback failed:", e);
        }
      }
      // Fallback
      playSynthFanfare();
    }

    function playPeonWorkSound() {
      try {
        const audio = new Audio("data:audio/mp3;base64," + SND_PEON_B64);
        audio.volume = 1.0;
        audio.play().catch(e => {
          console.log("Peon autoplay prevented, using synth fallback:", e);
          playSynthPeon();
        });
      } catch (err) {
        playSynthPeon();
      }
    }

    // Synthesizer Fallbacks
    function playSynthPing() {
      if (!audioCtx) initAudioEngine();
      if (!audioCtx) return;
      const now = audioCtx.currentTime;
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = "sine";
      osc.frequency.setValueAtTime(880, now);
      osc.frequency.exponentialRampToValueAtTime(1760, now + 0.15);
      gain.gain.setValueAtTime(0.3, now);
      gain.gain.exponentialRampToValueAtTime(0.001, now + 0.15);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start(now);
      osc.stop(now + 0.15);
    }

    function playSynthFanfare() {
      if (!audioCtx) initAudioEngine();
      if (!audioCtx) return;
      const now = audioCtx.currentTime;
      [523.25, 659.25, 783.99, 1046.50].forEach((freq, i) => {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = "triangle";
        osc.frequency.setValueAtTime(freq, now + (i * 0.08));
        gain.gain.setValueAtTime(0.3, now + (i * 0.08));
        gain.gain.exponentialRampToValueAtTime(0.001, now + (i * 0.08) + 0.4);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start(now + (i * 0.08));
        osc.stop(now + (i * 0.08) + 0.4);
      });
    }

    function playSynthPeon() {
      if (!audioCtx) initAudioEngine();
      if (!audioCtx) return;
      const now = audioCtx.currentTime;
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = "sawtooth";
      osc.frequency.setValueAtTime(140, now);
      osc.frequency.exponentialRampToValueAtTime(70, now + 0.4);
      gain.gain.setValueAtTime(0.5, now);
      gain.gain.exponentialRampToValueAtTime(0.01, now + 0.4);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start(now);
      osc.stop(now + 0.4);
    }

    /* ==========================================================================
       DATA STRUCTURES & STORAGE
       ========================================================================== */
    const DEFAULT_LIBRARY = [
      { id: "bp", name: "Beinpresse (horizontal/schräg)", category: "Beine", desc: "Füße schulterbreit, Knie stabil nach außen führen." },
      { id: "brp", name: "Brustpresse (Maschine)", category: "Brust", desc: "Schultern hinten fixieren, Brustkorb stolz halten." },
      { id: "lat", name: "Latzug zur Brust", category: "Rücken", desc: "Breiter Griff, kontrolliert zum oberen Brustbein ziehen." },
      { id: "rud", name: "Rudern am Seilzug/Maschine", category: "Rücken", desc: "Ellbogen eng am Körper nach hinten führen." },
      { id: "sp", name: "Schulterpresse (Maschine)", category: "Schultern", desc: "Ellbogen leicht vor dem Körper, kontrolliert nach oben." },
      { id: "bb", name: "Beinbeuger (sitzend/liegend)", category: "Beine", desc: "Spannung in der Oberschenkelrückseite halten." },
      { id: "triz_seil", name: "Trizepsdrücken am Seilzug (Seil)", category: "Trizeps", desc: "Ellbogen eng an den Rippen, unten auseinanderdrücken." },
      { id: "triz_oh", name: "Überkopf-Trizepsdrücken (Kabel)", category: "Trizeps", desc: "Ausfallschritt, Oberarme fixieren, Trizeps voll strecken." },
      { id: "biz_kabel", name: "Bizeps-Curls am Kabelzug", category: "Bizeps", desc: "Ellbogen fixiert, volle Kontraktion am oberen Punkt." },
      { id: "waden", name: "Wadenheben (sitzend/stehend)", category: "Waden", desc: "Vollständige Dehnung und Streckung der Fußspitzen." },
      { id: "crunch", name: "Crunches / Bauchmaschine", category: "Bauch", desc: "Kontrollierte Beugung aus den Bauchmuskeln." }
    ];

    let state = {
      player: {
        name: "Sven",
        level: 1,
        exp: 0,
        expNext: 100,
        rank: "E-Rang",
        str: 10,
        vit: 10,
        agi: 10,
        int: 10
      },
      exercises: [],
      prs: {},
      history: []
    };

    function loadState() {
      const saved = localStorage.getItem("solo_workout_state");
      if (saved) {
        try {
          state = JSON.parse(saved);
        } catch (e) {
          console.error("State parse error", e);
        }
      }
      if (!state.exercises || state.exercises.length === 0) {
        state.exercises = [
          { id: "bp", name: "Beinpresse (horizontal/schräg)", sets: [{ weight: 80, reps: 10, done: false }, { weight: 80, reps: 10, done: false }, { weight: 80, reps: 10, done: false }] },
          { id: "brp", name: "Brustpresse (Maschine)", sets: [{ weight: 45, reps: 10, done: false }, { weight: 45, reps: 10, done: false }, { weight: 45, reps: 10, done: false }] },
          { id: "lat", name: "Latzug zur Brust", sets: [{ weight: 40, reps: 10, done: false }, { weight: 40, reps: 10, done: false }, { weight: 40, reps: 10, done: false }] },
          { id: "rud", name: "Rudern am Seilzug/Maschine", sets: [{ weight: 40, reps: 10, done: false }, { weight: 40, reps: 10, done: false }, { weight: 40, reps: 10, done: false }] },
          { id: "sp", name: "Schulterpresse (Maschine)", sets: [{ weight: 25, reps: 10, done: false }, { weight: 25, reps: 10, done: false }] },
          { id: "bb", name: "Beinbeuger (sitzend/liegend)", sets: [{ weight: 35, reps: 12, done: false }, { weight: 35, reps: 12, done: false }] },
          { id: "triz_seil", name: "Trizepsdrücken am Seilzug (Seil)", sets: [{ weight: 20, reps: 12, done: false }, { weight: 20, reps: 12, done: false }] }
        ];
      }
      renderPlayerHUD();
      renderExercises();
      renderPRs();
      renderHistory();
    }

    function saveState() {
      localStorage.setItem("solo_workout_state", JSON.stringify(state));
    }

    /* ==========================================================================
       RENDER FUNCTIONS
       ========================================================================== */
    function renderPlayerHUD() {
      document.getElementById("playerNameDisplay").textContent = state.player.name.toUpperCase();
      document.getElementById("playerRankDisplay").textContent = state.player.rank;
      document.getElementById("playerLevelDisplay").textContent = "LVL " + state.player.level;

      const pct = Math.min(100, Math.floor((state.player.exp / state.player.expNext) * 100));
      document.getElementById("expBarFill").style.width = pct + "%";

      document.getElementById("statStr").textContent = state.player.str;
      document.getElementById("statVit").textContent = state.player.vit;
      document.getElementById("statAgi").textContent = state.player.agi;
      document.getElementById("statInt").textContent = state.player.int;
    }

    function renderExercises() {
      const container = document.getElementById("exerciseContainer");
      container.innerHTML = "";

      state.exercises.forEach((ex, exIdx) => {
        const item = document.createElement("div");
        item.className = "exercise-item";

        const prVal = state.prs[ex.name] ? `${state.prs[ex.name].weight === 0 ? 'BW' : state.prs[ex.name].weight + ' kg'} × ${state.prs[ex.name].reps}` : "—";

        let setsHTML = "";
        ex.sets.forEach((set, sIdx) => {
          const isBW = set.weight === 0;
          setsHTML += `
            <div class="set-row">
              <div class="set-num-box" onclick="removeSet(${exIdx}, ${sIdx})">
                <span class="set-num">#${sIdx + 1}</span>
                <span class="btn-trash">✕</span>
              </div>
              
              <!-- WEIGHT STEPPER -->
              <div class="stepper-capsule">
                <button class="stepper-btn" onclick="stepWeight(${exIdx}, ${sIdx}, -2.5)">−</button>
                <input type="text" class="stepper-input ${isBW ? 'bw-mode' : ''}" 
                  value="${isBW ? 'BW' : set.weight}" 
                  onfocus="onWeightFocus(this, ${set.weight})" 
                  onblur="onWeightBlur(this, ${exIdx}, ${sIdx})"
                  inputmode="decimal">
                <button class="stepper-btn" onclick="stepWeight(${exIdx}, ${sIdx}, 2.5)">+</button>
              </div>

              <!-- REPS STEPPER -->
              <div class="stepper-capsule">
                <button class="stepper-btn" onclick="stepReps(${exIdx}, ${sIdx}, -1)">−</button>
                <input type="number" class="stepper-input" value="${set.reps}" 
                  onchange="updateReps(${exIdx}, ${sIdx}, this.value)" 
                  inputmode="numeric">
                <button class="stepper-btn" onclick="stepReps(${exIdx}, ${sIdx}, 1)">+</button>
              </div>

              <!-- CHECK BUTTON -->
              <button class="btn-check ${set.done ? 'completed' : ''}" onclick="toggleSetDone(${exIdx}, ${sIdx})">
                ${set.done ? '✓' : ''}
              </button>
            </div>
          `;
        });

        item.innerHTML = `
          <div class="ex-header">
            <span class="ex-name">${ex.name}</span>
            <span class="ex-pr">PR: <span>${prVal}</span></span>
          </div>
          <div>${setsHTML}</div>
          <div>
            <span class="add-set-link" onclick="addSet(${exIdx})">+ Satz hinzufügen</span>
          </div>
        `;
        container.appendChild(item);
      });
    }

    function renderPRs() {
      const container = document.getElementById("prListContainer");
      const keys = Object.keys(state.prs);
      if (keys.length === 0) {
        container.innerHTML = `<div style="font-size:0.8rem; color:var(--text-muted); text-align:center; padding:12px;">Noch keine Rekorde verzeichnet. Hake Sätze ab, um PRs zu erringen!</div>`;
        return;
      }
      container.innerHTML = keys.map(k => `
        <div style="display:flex; justify-content:space-between; padding:8px 0; border-bottom:1px solid rgba(255,255,255,0.05); font-size:0.85rem;">
          <span>${k}</span>
          <b style="color:var(--gold);">${state.prs[k].weight === 0 ? 'BW' : state.prs[k].weight + ' kg'} × ${state.prs[k].reps}</b>
        </div>
      `).join("");
    }

    function renderHistory() {
      const container = document.getElementById("historyContainer");
      if (!state.history || state.history.length === 0) {
        container.innerHTML = `<div style="font-size:0.8rem; color:var(--text-muted); text-align:center; padding:12px;">Bisher noch keine Trainingseinheit absolviert.</div>`;
        return;
      }
      container.innerHTML = state.history.slice(-10).reverse().map(h => `
        <div class="history-card">
          <div class="history-date">${h.date} — Level ${h.level}</div>
          <div style="font-size:0.85rem; font-weight:700;">${h.summary}</div>
        </div>
      `).join("");
    }

    /* ==========================================================================
       WORKOUT INTERACTIONS
       ========================================================================== */
    function stepWeight(exIdx, sIdx, delta) {
      let current = state.exercises[exIdx].sets[sIdx].weight;
      current = Math.max(0, parseFloat((current + delta).toFixed(1)));
      state.exercises[exIdx].sets[sIdx].weight = current;
      saveState();
      renderExercises();
    }

    function onWeightFocus(input, val) {
      if (input.value === "BW") {
        input.value = "0";
      }
      input.select();
    }

    function onWeightBlur(input, exIdx, sIdx) {
      let val = parseFloat(input.value.replace(",", "."));
      if (isNaN(val) || val <= 0) {
        val = 0;
      }
      state.exercises[exIdx].sets[sIdx].weight = val;
      saveState();
      renderExercises();
    }

    function stepReps(exIdx, sIdx, delta) {
      let current = state.exercises[exIdx].sets[sIdx].reps;
      current = Math.max(1, current + delta);
      state.exercises[exIdx].sets[sIdx].reps = current;
      saveState();
      renderExercises();
    }

    function updateReps(exIdx, sIdx, val) {
      let r = parseInt(val, 10);
      if (isNaN(r) || r < 1) r = 1;
      state.exercises[exIdx].sets[sIdx].reps = r;
      saveState();
      renderExercises();
    }

    function addSet(exIdx) {
      const sets = state.exercises[exIdx].sets;
      const last = sets[sets.length - 1] || { weight: 20, reps: 10 };
      sets.push({ weight: last.weight, reps: last.reps, done: false });
      saveState();
      renderExercises();
    }

    function removeSet(exIdx, sIdx) {
      state.exercises[exIdx].sets.splice(sIdx, 1);
      // Auto-delete exercise if all sets are removed
      if (state.exercises[exIdx].sets.length === 0) {
        state.exercises.splice(exIdx, 1);
      }
      saveState();
      renderExercises();
    }

    function toggleSetDone(exIdx, sIdx) {
      const ex = state.exercises[exIdx];
      const set = ex.sets[sIdx];
      set.done = !set.done;

      if (set.done) {
        playSynthPing();

        // Check & Update PR
        const currentPr = state.prs[ex.name];
        const isBetter = !currentPr || 
                         (set.weight > currentPr.weight) || 
                         (set.weight === currentPr.weight && set.reps > currentPr.reps);

        if (isBetter) {
          state.prs[ex.name] = { weight: set.weight, reps: set.reps, date: new Date().toLocaleDateString('de-DE') };
          renderPRs();
        }

        // Start Auto Rest Timer
        startRestTimer(90);

        // Check if ALL sets of this exercise are completed -> WOW QUEST COMPLETE SOUND!
        const allDone = ex.sets.every(s => s.done);
        if (allDone) {
          setTimeout(() => {
            playQuestDoneSound();
          }, 300);
        }
      }

      saveState();
      renderExercises();
    }

    /* ==========================================================================
       REST TIMER LOGIC
       ========================================================================== */
    let restInterval = null;
    let restRemaining = 0;

    function startRestTimer(seconds) {
      clearInterval(restInterval);
      restRemaining = seconds;

      document.getElementById("restIdleBox").style.display = "none";
      document.getElementById("restActiveBox").style.display = "flex";
      updateRestDisplay();

      restInterval = setInterval(() => {
        restRemaining--;
        if (restRemaining <= 0) {
          clearInterval(restInterval);
          skipRestTimer();
          // PLAY ORIGINAL PEON "MEHR ARBEIT?"
          playPeonWorkSound();
        } else {
          updateRestDisplay();
        }
      }, 1000);
    }

    function updateRestDisplay() {
      const m = Math.floor(restRemaining / 60);
      const s = restRemaining % 60;
      document.getElementById("restActiveCountdown").textContent = 
        `${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}`;
    }

    function adjustRestTimer(delta) {
      restRemaining = Math.max(5, restRemaining + delta);
      updateRestDisplay();
    }

    function skipRestTimer() {
      clearInterval(restInterval);
      document.getElementById("restActiveBox").style.display = "none";
      document.getElementById("restIdleBox").style.display = "flex";
    }

    /* ==========================================================================
       CROSSTRAINER WARMUP TIMER
       ========================================================================== */
    let warmupInterval = null;
    let warmupSeconds = 600; // 10 min
    let warmupRunning = false;

    function toggleWarmupTimer() {
      const btn = document.getElementById("warmupToggleBtn");
      if (warmupRunning) {
        clearInterval(warmupInterval);
        warmupRunning = false;
        btn.textContent = "START";
        btn.classList.remove("active");
      } else {
        warmupRunning = true;
        btn.textContent = "STOP";
        btn.classList.add("active");
        warmupInterval = setInterval(() => {
          warmupSeconds--;
          if (warmupSeconds <= 0) {
            clearInterval(warmupInterval);
            warmupRunning = false;
            btn.textContent = "START";
            btn.classList.remove("active");
            addExp(50);
            state.player.agi += 1;
            saveState();
            renderPlayerHUD();
            playQuestDoneSound();
          }
          updateWarmupDisplay();
        }, 1000);
      }
    }

    function resetWarmupTimer() {
      clearInterval(warmupInterval);
      warmupRunning = false;
      warmupSeconds = 600;
      document.getElementById("warmupToggleBtn").textContent = "START";
      document.getElementById("warmupToggleBtn").classList.remove("active");
      updateWarmupDisplay();
    }

    function updateWarmupDisplay() {
      const m = Math.floor(warmupSeconds / 60);
      const s = warmupSeconds % 60;
      document.getElementById("warmupDisplay").textContent = 
        `${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}`;
    }

    /* ==========================================================================
       SYSTEM LEVEL-UP & QUEST COMPLETION
       ========================================================================== */
    function addExp(amount) {
      state.player.exp += amount;
      while (state.player.exp >= state.player.expNext) {
        state.player.exp -= state.player.expNext;
        state.player.level++;
        state.player.expNext = Math.floor(state.player.expNext * 1.25);
        state.player.str += 2;
        state.player.vit += 1;

        // Rank updates
        if (state.player.level >= 20) state.player.rank = "S-Rang: Schattenmonarch";
        else if (state.player.level >= 15) state.player.rank = "A-Rang";
        else if (state.player.level >= 10) state.player.rank = "B-Rang";
        else if (state.player.level >= 5) state.player.rank = "C-Rang";
        else if (state.player.level >= 3) state.player.rank = "D-Rang";
      }
    }

    function finishQuest() {
      addExp(150);
      playQuestDoneSound();

      // Add to history
      const now = new Date();
      const summary = `${state.exercises.length} Übungen abgeschlossen`;
      state.history.push({
        date: now.toLocaleDateString("de-DE") + " " + now.toLocaleTimeString("de-DE", { hour: "2-digit", minute: "2-digit" }),
        level: state.player.level,
        summary: summary
      });

      // Reset checkboxes for next workout
      state.exercises.forEach(ex => {
        ex.sets.forEach(s => s.done = false);
      });

      saveState();
      renderPlayerHUD();
      renderExercises();
      renderHistory();
      alert("QUEST ABGESCHLOSSEN! +150 EXP vergeben.");
    }

    function editPlayerName() {
      const n = prompt("Neuen Spielernamen eingeben:", state.player.name);
      if (n && n.trim() !== "") {
        state.player.name = n.trim();
        saveState();
        renderPlayerHUD();
      }
    }

    /* ==========================================================================
       MODAL: EXERCISE LIBRARY
       ========================================================================== */
    function openAddExerciseModal() {
      document.getElementById("addExerciseModal").style.display = "flex";
      renderExerciseLibrary(DEFAULT_LIBRARY);
    }

    function closeAddExerciseModal() {
      document.getElementById("addExerciseModal").style.display = "none";
    }

    function switchModalTab(tab) {
      const libTab = document.getElementById("modalTabLib");
      const customTab = document.getElementById("modalTabCustom");
      const libBtn = document.getElementById("tabLibBtn");
      const customBtn = document.getElementById("tabCustomBtn");

      if (tab === "lib") {
        libTab.style.display = "block";
        customTab.style.display = "none";
        libBtn.classList.add("active");
        customBtn.classList.remove("active");
      } else {
        libTab.style.display = "none";
        customTab.style.display = "flex";
        customBtn.classList.add("active");
        libBtn.classList.remove("active");
      }
    }

    function renderExerciseLibrary(list) {
      const container = document.getElementById("exerciseLibraryList");
      container.innerHTML = list.map(item => `
        <div class="lib-item" onclick="chooseExerciseFromLib('${item.name}')">
          <div>
            <div class="lib-item-name">${item.name}</div>
            <div style="font-size:0.7rem; color:var(--text-muted);">${item.desc || ''}</div>
          </div>
          <span class="lib-item-cat">${item.category}</span>
        </div>
      `).join("");
    }

    function filterExerciseLibrary() {
      const query = document.getElementById("searchExInput").value.toLowerCase();
      const filtered = DEFAULT_LIBRARY.filter(i => 
        i.name.toLowerCase().includes(query) || i.category.toLowerCase().includes(query)
      );
      renderExerciseLibrary(filtered);
    }

    function chooseExerciseFromLib(name) {
      state.exercises.push({
        id: "ex_" + Date.now(),
        name: name,
        sets: [{ weight: 20, reps: 10, done: false }, { weight: 20, reps: 10, done: false }]
      });
      saveState();
      renderExercises();
      closeAddExerciseModal();
    }

    function saveCustomExercise() {
      const name = document.getElementById("customExName").value.trim();
      if (!name) return;
      chooseExerciseFromLib(name);
      document.getElementById("customExName").value = "";
    }

    /* ==========================================================================
       NAVIGATION TABS
       ========================================================================== */
    function switchTab(tabId, el) {
      document.querySelectorAll(".tab-content").forEach(c => c.classList.remove("active"));
      document.querySelectorAll(".nav-btn").forEach(b => b.classList.remove("active"));
      document.getElementById(tabId).classList.add("active");
      el.classList.add("active");
    }

    // Init App
    loadState();
  </script>
</body>
